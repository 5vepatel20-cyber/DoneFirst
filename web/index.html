<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="donefirst">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>donefirst</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Error logging so white-screen issues are visible -->
  <div id="error-display" style="display:none;color:red;padding:20px;font-family:monospace;white-space:pre-wrap;"></div>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      var el = document.getElementById('error-display');
      el.style.display = 'block';
      el.textContent += 'ERROR: ' + msg + '\n' + url + ':' + line + '\n';
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('error-display');
      el.style.display = 'block';
      el.textContent += 'UNHANDLED PROMISE: ' + e.reason + '\n';
    });
  </script>
  <script>
    // Clear all caches and unregister all service workers BEFORE
    // loading the Flutter bootstrap. This prevents stale assets
    // from being served after a new deployment.
    async function clearCachesAndLoad() {
      if ('serviceWorker' in navigator) {
        try {
          var regs = await navigator.serviceWorker.getRegistrations();
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        } catch (e) {}
      }
      if ('caches' in window) {
        try {
          var names = await caches.keys();
          for (var i = 0; i < names.length; i++) {
            await caches.delete(names[i]);
          }
        } catch (e) {}
      }
      // Now load Flutter with a cache-busting query string.
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js?' + Date.now();
      s.async = true;
      document.body.appendChild(s);
    }
    clearCachesAndLoad();
  </script>
</body>
</html>
